<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Gestion SOC = FrenchJumper</title>
<link rel="icon" href="./favicon.ico">

<script>console.log("Page = index.html")</script>

<script src="js/config.js"></script>
<style>

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
}

/* layout */
.app{
    display:flex;
    height:100vh;
}

/* menu gauche */
.sidebar{
    width:220px;
    background:#2c3e50;
    color:white;
    padding-top:20px;
    display:flex;
    flex-direction:column;
}

.sidebar h2{
    text-align:center;
    margin-bottom:20px;
}

.menu{
    list-style:none;
    padding:0;
    margin:0;
}

.auth-panel{
    margin-top:auto;
    padding:14px;
    border-top:1px solid rgba(255,255,255,.2);
}

.auth-status{
    margin:0 0 10px;
    font-size:12px;
    line-height:1.35;
}

.auth-button{
    width:100%;
    padding:9px 10px;
    border:0;
    border-radius:4px;
    cursor:pointer;
    font-weight:bold;
}

.auth-notice{
    display:none;
    margin:0 14px 12px;
    padding:9px;
    border-radius:4px;
    background:#fff3cd;
    color:#664d03;
    font-size:12px;
    line-height:1.35;
}

.menu li{
    padding:12px 20px;
    cursor:pointer;
}

.menu li:hover{
    background:#34495e;
}

/* zone contenu */
.content{
    flex:1;
}

iframe{
    width:100%;
    height:100%;
    border:none;
}

</style>
</head>

<body>

<div class="app">

    <div class="sidebar">
        <h2>FrenchJumper</h2>

        <ul class="menu">
			<li onclick="loadPage('actifs.html')">Membres Actifs</li>
			<li onclick="loadPage('anciens.html')">Anciens Membres</li>
			<li id="menuNouveauMembre" onclick="loadPage('nouveau.html')" style="display:none;">Nouveau Membre</li>
			<li onclick="loadPage('mouvements.html')">Mouvements</li>
			<li id="menuSynchronisation" onclick="loadPage('sync.html')" style="display:none;">Synchronisation GAS / D1</li>
		</ul>

        <p id="authNotice" class="auth-notice" role="status"></p>
        <div class="auth-panel">
            <p id="authStatus" class="auth-status">Vérification de la connexion…</p>
            <button id="authButton" class="auth-button" type="button">Connexion Discord</button>
        </div>

    </div>

    <div class="content">
        <iframe id="mainFrame" src="actifs.html"></iframe>
    </div>

</div>

<script>

let authenticationNoticeTimer = null;

document.getElementById("mainFrame").src = buildPageUrl("actifs.html");

ensurePreferredBackendAvailable()
    .catch(error => console.error("Initialisation :", error));

initializeAuthenticationControls();
window.addEventListener("frj-backend-changed", () => renderAuthentication(authState));
window.addEventListener("frj-auth-state-changed", event => {
    renderAuthentication(event.detail);
    const notice = takeAuthenticationNotice();
    if (notice) showStoredAuthenticationNotice(notice);
});

async function initializeAuthenticationControls() {
    const notice = takeAuthenticationNotice();
    if (notice) showStoredAuthenticationNotice(notice);
    const state = await ensureAuthState();
    renderAuthentication(state);
}

function renderAuthentication(state) {
    const status = document.getElementById("authStatus");
    const button = document.getElementById("authButton");
    const authorized = state && state.authorized === true;
    const authenticated = state && state.authenticated === true;
    const frjMember = state && state.frjMember === true;
    document.getElementById("menuNouveauMembre").style.display = authorized ? "" : "none";
    document.getElementById("menuSynchronisation").style.display = authorized && getActiveBackend() === "d1" ? "" : "none";
    if (authenticated) {
        clearAuthenticationNotice();
        refreshPageAfterAuthentication();
        const name = state.user && state.user.name ? state.user.name : "Discord";
        status.textContent = authorized
            ? `${name} — accès RH`
            : frjMember ? `${name} — Consultation FRJ` : `${name} — consultation publique`;
        if (state.stale) status.textContent += " (vérification différée)";
        button.textContent = "Déconnexion";
        button.onclick = () => {
            const currentPage = getCurrentFramePage();
            logoutDiscord();
            const notice = takeAuthenticationNotice();
            if (notice) showStoredAuthenticationNotice(notice);
            renderAuthentication(authState);
            reloadInternalPage(currentPage);
        };
    } else {
        status.textContent = "Consultation publique";
        button.textContent = "Connexion Discord";
        button.onclick = async () => {
            button.disabled = true;
            rememberAuthenticationReturnPage(getCurrentFramePage());
            try { await beginDiscordLogin(); }
            catch (error) {
                takeAuthenticationReturnPage();
                showAuthenticationNotice(error.message || "Connexion Discord impossible pour le moment.");
            }
            finally { button.disabled = false; }
        };
    }
    const frame = document.getElementById("mainFrame");
    if (!authorized && /(?:^|\/)nouveau\.html/.test(frame.getAttribute("src") || "")) loadPage("actifs.html");
}

function showStoredAuthenticationNotice(notice) {
    showAuthenticationNotice(notice.message, notice.code === "logged_out" ? 15000 : 0);
}

function showAuthenticationNotice(message, timeoutMs = 0) {
    if (authenticationNoticeTimer !== null) clearTimeout(authenticationNoticeTimer);
    const notice = document.getElementById("authNotice");
    notice.textContent = message;
    notice.style.display = "block";
    authenticationNoticeTimer = timeoutMs > 0 ? setTimeout(clearAuthenticationNotice, timeoutMs) : null;
}

function clearAuthenticationNotice() {
    if (authenticationNoticeTimer !== null) clearTimeout(authenticationNoticeTimer);
    authenticationNoticeTimer = null;
    const notice = document.getElementById("authNotice");
    notice.textContent = "";
    notice.style.display = "none";
}

function getCurrentFramePage() {
    const frame = document.getElementById("mainFrame");
    try {
        const target = new URL(frame.contentWindow.location.href, window.location.href);
        const siteRoot = new URL(".", window.location.href);
        if (target.origin === window.location.origin && target.pathname.startsWith(siteRoot.pathname)) {
            return target.pathname.slice(siteRoot.pathname.length) + target.search + target.hash;
        }
    } catch {}
    return frame.getAttribute("src") || "";
}

function refreshPageAfterAuthentication() {
    const page = takeAuthenticationReturnPage();
    reloadInternalPage(page);
}

function reloadInternalPage(page) {
    if (!page) return;
    let target;
    try { target = new URL(page, window.location.href); }
    catch { return; }
    const siteRoot = new URL(".", window.location.href);
    if (target.origin !== window.location.origin || !target.pathname.startsWith(siteRoot.pathname)) return;
    document.getElementById("mainFrame").src = page;
}

function loadPage(page){
	console.log("Fonction : index.html - loadPage(page)");
    document.getElementById("mainFrame").src = buildPageUrl(page);
}

function buildPageUrl(page) {
    return buildInternalPageUrl(page);
}

</script>

</body>
</html>
