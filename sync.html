<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Synchronisation GAS / D1</title>
  <link rel="icon" href="./favicon.ico">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js"></script>
  <script src="js/client.js"></script>
</head>
<body>
  <div class="header">
    <a href="index.html" target="_parent" class="link-header"><h3>&lt;&lt; Accueil</h3></a>
    <h3>Synchronisation GAS / D1</h3>
  </div>
  <main class="container">
    <div class="card">
      <h2>État de la réplication</h2>
      <p id="syncSummary">Chargement…</p>
      <button id="auditButton" type="button">Contrôler maintenant</button>
      <button id="retryButton" type="button">Relancer les attentes</button>
    </div>
    <div class="card">
      <h2>Dernier contrôle</h2>
      <pre id="syncAudit">Aucun contrôle</pre>
    </div>
    <div class="card">
      <h2>Mutations récentes</h2>
      <div style="overflow:auto">
        <table>
          <thead><tr><th>Date</th><th>Source</th><th>Cible</th><th>Opération</th><th>État</th><th>Essais</th><th>Erreur</th></tr></thead>
          <tbody id="syncRows"></tbody>
        </table>
      </div>
    </div>
  </main>
  <script>
    const esc = value => String(value ?? "").replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[char]);
    async function loadSyncStatus() {
      // Cette page admin n'existe que côté D1 : déterminer le backend actif avant
      // de tenter une action, afin de ne jamais envoyer ses commandes à GAS.
      await ensurePreferredBackendAvailable();
      if (getActiveBackend() !== "d1") {
        document.getElementById("syncSummary").textContent =
          "D1 est indisponible : le suivi de synchronisation reste désactivé pendant le secours GAS.";
        return;
      }
      const state = await ensureAuthState();
      if (!state.authorized) {
        document.getElementById("syncSummary").textContent = state.authenticated
          ? "Un rôle RH Discord est requis pour consulter la synchronisation."
          : "Connectez-vous depuis le menu principal pour consulter la synchronisation.";
        return;
      }
      const data = await apiRequestD1Only("getSyncStatus");
      document.getElementById("syncSummary").textContent = data.counts.length
        ? data.counts.map(item => `${item.target} ${item.status}: ${item.count}`).join(" · ")
        : "Aucune mutation enregistrée";
      document.getElementById("syncAudit").textContent = data.lastAudit
        ? JSON.stringify(data.lastAudit, null, 2) : "Aucun contrôle";
      document.getElementById("syncRows").innerHTML = data.recent.map(item => `<tr>
        <td>${esc(item.created_at)}</td><td>${esc(item.source)}</td><td>${esc(item.target)}</td>
        <td>${esc(item.operation)}</td><td>${esc(item.status)}</td><td>${esc(item.attempts)}</td>
        <td>${esc(item.last_error || "")}</td></tr>`).join("");
    }
    async function runD1SyncAction(action) {
      await apiRequestD1Only(action);
      await loadSyncStatus();
    }
    document.getElementById("auditButton").onclick = () => runD1SyncAction("runSyncAudit");
    document.getElementById("retryButton").onclick = () => runD1SyncAction("retryPendingSync");
    loadSyncStatus().catch(error => { document.getElementById("syncSummary").textContent = error.message; });
  </script>
</body>
</html>
